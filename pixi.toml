[workspace]
name = "still-wakes-the-deep-headtracking"
version = "0.3.0"
description = "Head tracking mod for Still Wakes the Deep (UE5)"
license = "MIT"
license-file = "LICENSE"
channels = ["conda-forge"]
platforms = ["win-64"]

[tasks]
update-submodule = "git submodule update --remote cameraunlock-core && powershell -NoProfile -ExecutionPolicy Bypass -File cameraunlock-core/scripts/update-submodule.ps1"
sync = "git submodule update --remote cameraunlock-core"

# No -G: let CMake auto-detect the installed Visual Studio generator. Pinning
# "Visual Studio 17 2022" broke on CI once the windows runner image moved to
# VS 2026 (VS 17 absent); auto-detect picks whatever VS the machine has.
setup = { cmd = """
    powershell -Command "if (-not (Test-Path 'build')) { cmake -B build -A x64 } else { Write-Host 'Build directory exists, skipping setup' -ForegroundColor Yellow }"
""" }

build = { cmd = "cmake --build build --config Release", depends-on = ["setup"] }
build-debug = { cmd = "cmake --build build --config Debug", depends-on = ["setup"] }

# Behaviour locks for the camera boundary and the caller gate, the config
# tests, the config differential test, which holds the frozen HeadTracking.ini
# reader to v0.2.0's and the migration into CameraUnlock.ini to that reader, and
# core's canonical config lint over every file that test migrated (run with
# node). Needs no game install.
test-unit = { cmd = "ctest --test-dir build -C Release --output-on-failure -LE differential", depends-on = ["build"] }
test-differential = { cmd = "ctest --test-dir build -C Release --output-on-failure --no-tests=error -L differential", depends-on = ["build"] }
test = { depends-on = ["test-unit", "test-differential"] }

# Rewrites CameraUnlock.ini, the committed config, from the config table after a
# change to a row, a comment or a default, then the launcher manifest's config
# descriptor per_game from it. swtd_config_tests fails until it has run.
render-config = { cmd = "build/Release/swtd_config_tests.exe --render-config CameraUnlock.ini && node cameraunlock-core/scripts/encode-seed.mjs", depends-on = ["build"] }

clean = { cmd = """
    powershell -Command "if (Test-Path 'build') { Remove-Item 'build' -Recurse -Force }; Write-Host 'Build artifacts cleaned' -ForegroundColor Green"
""" }

clean-all = { cmd = """
    powershell -Command "foreach ($d in @('build','release')) { if (Test-Path $d) { Remove-Item $d -Recurse -Force } }; Write-Host 'All build artifacts cleaned' -ForegroundColor Green"
""" }

# Bump vendored Ultimate ASI Loader copy. Manual, with a commit attached -
# nothing depends on it; build/package/release consume whatever is committed
# under vendor/.
update-deps = { cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/update-deps.ps1" }

# Package both release ZIPs (installer + nexus). Depends on test-unit, so no ZIP
# is built from a tree whose behaviour locks or config tests fail. The config
# differential runs on the release paths.
package = { cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package-release.ps1", depends-on = ["test-unit"] }

# Checks the newest release/*-installer.zip's launcher-manifest.json against the
# files in the ZIP, and that neither ZIP carries CameraUnlock.ini or
# HeadTracking.ini. Run it after package.
validate-manifest = "node cameraunlock-core/scripts/validate-manifest.mjs"

# Full release workflow: stamp version, changelog, package, commit, tag, push.
# Unattended - `pixi run release minor` is the authorization, there is no prompt.
release = { cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release.ps1" }

# Build + deploy to game directory (dev loop)
deploy = { cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/deploy.ps1", depends-on = ["build"] }

# Strip the logo/cutscene videos and the slow streaming defaults out of the
# local install so the test loop is short. fast-boot-restore puts them back.
fast-boot = { cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/fast-boot.ps1" }
fast-boot-status = { cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/fast-boot.ps1 -Action Status" }
fast-boot-restore = { cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/fast-boot.ps1 -Action Restore" }

# Launch the game for a test run (-nosplash; see -Map / -Windowed / -ListMaps)
launch = { cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/launch.ps1" }

# Build + deploy into the detected game install (the dev-loop install).
install = { depends-on = ["deploy"] }
uninstall = "cmd /c scripts\\uninstall.cmd"

[dependencies]
# CMake and Visual Studio come from the system. Node runs the canonical config
# lint in `test`, render-config's encode-seed step, validate-manifest and
# core's config descriptor check in packaging (Copy-SharedBundle). Pinned to the
# release core's own lock resolves.
nodejs = "==26.5.0"
