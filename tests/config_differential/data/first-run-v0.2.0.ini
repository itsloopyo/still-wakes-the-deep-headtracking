; Still Wakes the Deep Head Tracking - configuration
; Edit values, restart the game to apply.

[Network]
UdpPort=4242

[General]
EnableOnStartup=1
; Yaw mode: 1 = horizon-locked yaw (default), 0 = camera-local yaw.
; Page Down (or Ctrl+Shift+H) toggles it in game.
WorldSpaceYaw=1

[Rotation]
YawSensitivity=1.0
PitchSensitivity=1.0
RollSensitivity=1.0
InvertYaw=0
InvertPitch=0
InvertRoll=0
; Smoothing 0.0 (responsive) - 1.0 (heavy). Covers rotation and position.
; The value is picked per connection from the packet source address:
; LocalSmoothing for a tracker running on this PC (loopback),
; RemoteSmoothing for a phone or other device on the network.
LocalSmoothing=0.0
RemoteSmoothing=0.15

[Camera]
; Degrees added to the game's field of view. Still Wakes the Deep has no
; FOV setting of its own, so this is the only way to widen the view. It is
; an offset rather than a fixed FOV, so the game keeps the FOV changes it
; makes itself, and cutscenes and menus stay at the framing it chose. Head
; tracking still runs during a cutscene; only the offset stands down.
; HeadTracking.log prints the FOV the game renders at, so you can see what
; you are adding to. Range -30 to +60; 0 leaves the game alone.
FovOffset=0.0

[Position]
Enabled=1
SensitivityX=1.0
SensitivityY=1.0
SensitivityZ=1.0
LimitX=0.30
LimitY=0.20
LimitYDown=0.20
LimitZ=0.40
LimitZBack=0.10

[Torch]
; Point the torch where you are looking rather than where you are aiming.
; Multiplier scales the head pose the beam is given. The default leads the
; view, because turning your head puts your eyes off the centre of the screen
; and a beam matched to the view lands short of what you are looking at.
; 1.0 moves the beam with the view, 0.0 leaves it where the game aimed it.
Enabled=1
Multiplier=1.5
; The torch's glare card hangs off the torch body rather than the beam, so
; with the beam on your head the glare gets left behind and reads as pinned
; to the world. This moves it onto the beam, where it picks up the beam's
; own sway.
FlareFollowsBeam=1

[Hotkeys]
; Virtual-key code for the yaw-mode toggle. Ctrl+Shift+H does the same
; job and is not configurable.
YawModeKey=0x22

[Dev]
; Ctrl+Shift+U / Ctrl+Shift+J cycle which GetPlayerViewPoint caller is
; head-tracked. Only needed to re-confirm the render caller after a
; game patch moves it.
InjectHotkeys=0
